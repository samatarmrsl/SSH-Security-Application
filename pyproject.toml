[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-security-application"
version = "0.1.0"
description = "Multi-source SSH brute-force detection and temporary blocking for an authorized Ubuntu lab"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SSH Security Application contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
ssh-security-app = "ssh_security_application.main:main"
setup-ssh-security-lab = "ssh_security_application.lab:main"

[tool.setuptools]
package-dir = { "" = "application_source_code" }

[tool.setuptools.package-data]
ssh_security_application = [
  "default_config.json",
  "sqlite_data_storage/*.sql",
]

[tool.setuptools.packages.find]
where = ["application_source_code"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["verification_and_validation"]
python_files = ["verify_*.py"]
python_functions = ["test_*", "verify_*"]

[tool.coverage.run]
branch = true
source = ["ssh_security_application"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
